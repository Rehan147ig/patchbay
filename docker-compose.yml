services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: patchbay-postgres
    environment:
      POSTGRES_USER: patchbay
      POSTGRES_PASSWORD: patchbay_dev_only
      POSTGRES_DB: patchbay
    ports:
      # 5434 on the host to avoid clashes with other local stacks (5432/5433 are taken).
      - "5434:5432"
    volumes:
      - patchbay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchbay -d patchbay"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: patchbay-redis
    ports:
      # 6380 on the host to avoid clashes with other local stacks (6379 is commonly taken).
      - "6380:6379"
    volumes:
      - patchbay_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  patchbay_pgdata:
  patchbay_redisdata:
