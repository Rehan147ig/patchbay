version: "3.9"

services:
  # ---------- PostgreSQL (managed by Docker, data persists) ----------
  db:
    image: postgres:15-alpine
    container_name: patchbay-db
    restart: unless-stopped
    env_file: .env.example
    environment:
      POSTGRES_USER: patchbay
      POSTGRES_PASSWORD: patchbay_dev_only
      POSTGRES_DB: patchbay
    ports:
      - "5434:5432" # host:container - matches DATABASE_URL default
    volumes:
      - pg_data:/var/lib/postgresql/data # persistent across restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchbay -d patchbay"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Redis (BullMQ queue + rate-limit + org concurrency) ----------
  redis:
    image: redis:7-alpine
    container_name: patchbay-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass patchbay_dev_only
      --save ""
      --appendonly no
    ports:
      - "6380:6379" # host:container - matches REDIS_URL default
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a patchbay_dev_only ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Next.js Web App (dashboard + API routes) ----------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: patchbay-web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file: .env.example
    environment:
      DATABASE_URL: "postgresql://patchbay:patchbay_dev_only@db:5434/patchbay?schema=public"
      REDIS_URL: "redis://:patchbay_dev_only@redis:6380"
      NODE_ENV: production
      PORT: "3000"
      SANDBOX_RUNTIME: process
    ports:
      - "3000:3000" # host port 3000 → container 3000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------- Worker (BullMQ job processor, runs 24/7) ----------
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: patchbay-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file: .env.example
    environment:
      DATABASE_URL: "postgresql://patchbay:patchbay_dev_only@db:5434/patchbay?schema=public"
      REDIS_URL: "redis://:patchbay_dev_only@redis:6380"
      NODE_ENV: production
      PORT: "3001"
      SANDBOX_RUNTIME: container
      SANDBOX_VALIDATION_MODE: hosted-docker
      SANDBOX_TIMEOUT_MS: "120000"
      SANDBOX_MAX_OUTPUT_CHARS: "20000"
    # No port needed — worker is a background job processor
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/healthz 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3

volumes:
  pg_data:
    driver: local
