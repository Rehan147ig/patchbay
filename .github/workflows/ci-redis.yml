name: CI with Redis

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - run: pnpm typecheck
      - name: Unit tests (non-Redis)
        run: pnpm test
      - name: Redis readiness check
        run: |
          sudo apt-get update && sudo apt-get install -y redis-tools
          for i in $(seq 1 30); do
            if redis-cli ping | grep -q PONG; then
              echo "Redis ready"
              exit 0
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 1
          done
          echo "Redis failed to become ready after 30s"
          exit 1
      - name: Redis integration tests
        run: pnpm test:redis-integration
      - name: Corpus tests
        run: pnpm test:corpus
      - run: pnpm lint
      - run: pnpm format:check
