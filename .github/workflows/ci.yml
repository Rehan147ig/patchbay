name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: patchbay
          POSTGRES_PASSWORD: patchbay_dev_only
          POSTGRES_DB: patchbay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U patchbay -d patchbay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: "postgresql://patchbay:patchbay_dev_only@localhost:5432/patchbay?schema=public"
      - name: Seed database
        run: pnpm db:seed
        env:
          DATABASE_URL: "postgresql://patchbay:patchbay_dev_only@localhost:5432/patchbay?schema=public"
      - run: pnpm build
        env:
          DATABASE_URL: "postgresql://patchbay:patchbay_dev_only@localhost:5432/patchbay?schema=public"
